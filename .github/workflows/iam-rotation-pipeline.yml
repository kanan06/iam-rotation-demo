name: IAM Key Rotation Pipeline

on:
  push:
    branches: [clean-branch, main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'demo'
        type: choice
        options:
        - demo
        - staging
        - production
  repository_dispatch:
    types: [iam-rotation-triggered]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  setup-oidc:
    runs-on: ubuntu-latest
    outputs:
      aws-account-id: ${{ steps.get-account-id.outputs.account-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160885290762:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Get AWS Account ID
        id: get-account-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "AWS Account ID: $ACCOUNT_ID"

  test-aws-access:
    runs-on: ubuntu-latest
    needs: setup-oidc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160885290762:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Test AWS Access
        run: |
          echo "Testing AWS access..."
          aws sts get-caller-identity
          echo "✅ AWS access successful!"

      - name: List Config Bucket Contents
        run: |
          echo "Listing config bucket contents..."
          aws s3 ls s3://iam-rotation-demo-config-160885290762/
          echo "✅ Config bucket access successful!"

      - name: Check CloudFormation Stack
        run: |
          echo "Checking CloudFormation stack..."
          aws cloudformation describe-stacks --stack-name iam-rotation-demo --query 'Stacks[0].StackStatus' --output text
          echo "✅ CloudFormation access successful!"

  deploy-demo-website:
    runs-on: ubuntu-latest
    needs: test-aws-access
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160885290762:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Deploy Demo Website
        run: |
          echo "Deploying demo website..."
          aws s3 cp final_demo/demo-website.html s3://iam-rotation-demo-app-160885290762/
          aws s3 cp final_demo/index.html s3://iam-rotation-demo-app-160885290762/
          echo "✅ Demo website deployed successfully!"

      - name: Test Website Access
        run: |
          echo "Testing website access..."
          curl -s https://iam-rotation-demo-app-160885290762.s3.amazonaws.com/ | head -5
          echo "✅ Website accessible!"

  notify-success:
    runs-on: ubuntu-latest
    needs: deploy-demo-website
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160885290762:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Send Success Notification
        run: |
          echo "IAM Rotation Pipeline completed successfully!"
          echo "Demo website deployed and accessible"
          echo "All AWS services verified"
