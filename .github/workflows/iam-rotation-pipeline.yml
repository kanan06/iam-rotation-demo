name: IAM Key Rotation Pipeline

on:
  push:
    branches: [clean-branch, main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'demo'
        type: choice
        options:
        - demo
        - staging
        - production
  repository_dispatch:
    types: [iam-rotation-triggered]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  setup-oidc:
    runs-on: ubuntu-latest
    outputs:
      aws-account-id: ${{ steps.get-account-id.outputs.account-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160885290762:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Get AWS Account ID from CloudFormation
        id: get-account-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "AWS Account ID: $ACCOUNT_ID"

  fetch-credentials:
    runs-on: ubuntu-latest
    needs: setup-oidc
    outputs:
      aws-access-key-id: ${{ steps.fetch-creds.outputs.aws-access-key-id }}
      aws-secret-access-key: ${{ steps.fetch-creds.outputs.aws-secret-access-key }}
      aws-region: ${{ steps.fetch-creds.outputs.aws-region }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install boto3 requests

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160885290762:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Fetch AWS Credentials from S3
        id: fetch-creds
        run: |
          python3 scripts/fetch-aws-credentials.py env1.env

  health-check:
    runs-on: ubuntu-latest
    needs: fetch-credentials
    outputs:
      health-score: ${{ steps.health-check.outputs.score }}
      health-status: ${{ steps.health-check.outputs.status }}
      rollback-needed: ${{ steps.health-check.outputs.rollback }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.fetch-credentials.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ needs.fetch-credentials.outputs.aws-secret-access-key }}
          aws-region: ${{ needs.fetch-credentials.outputs.aws-region }}

      - name: Run Health Check
        id: health-check
        run: |
          python3 scripts/health-check.py
        env:
          AWS_ACCESS_KEY_ID: ${{ needs.fetch-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ needs.fetch-credentials.outputs.aws-secret-access-key }}
          AWS_REGION: ${{ needs.fetch-credentials.outputs.aws-region }}

      - name: Health Check Results
        run: |
          echo "Health Score: ${{ steps.health-check.outputs.score }}"
          echo "Health Status: ${{ steps.health-check.outputs.status }}"
          echo "Rollback Needed: ${{ steps.health-check.outputs.rollback }}"

  backup-current:
    runs-on: ubuntu-latest
    needs: [fetch-credentials, health-check]
    if: needs.health-check.outputs.health-status == 'HEALTHY'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.fetch-credentials.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ needs.fetch-credentials.outputs.aws-secret-access-key }}
          aws-region: ${{ needs.fetch-credentials.outputs.aws-region }}

      - name: Backup current application
        run: |
          # Get app bucket name
          APP_BUCKET=$(aws cloudformation describe-stacks --stack-name iam-rotation-demo --query 'Stacks[0].Outputs[?OutputKey==`DemoAppBucket`].OutputValue' --output text)
          
          # Create backup timestamp
          BACKUP_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # Check if index.html exists and backup it
          if aws s3 ls s3://$APP_BUCKET/index.html > /dev/null 2>&1; then
            aws s3 cp s3://$APP_BUCKET/index.html s3://$APP_BUCKET/backup/index.html.$BACKUP_TIMESTAMP
            echo "✅ Current application backed up to s3://$APP_BUCKET/backup/index.html.$BACKUP_TIMESTAMP"
          else
            echo "ℹ️ No current application to backup"
          fi

  deploy-application:
    runs-on: ubuntu-latest
    needs: [fetch-credentials, health-check, backup-current]
    if: needs.health-check.outputs.health-status == 'HEALTHY'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.fetch-credentials.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ needs.fetch-credentials.outputs.aws-secret-access-key }}
          aws-region: ${{ needs.fetch-credentials.outputs.aws-region }}

      - name: Create demo website
        run: |
          # Create a beautiful demo website
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>IAM Key Rotation Demo</title>
              <style>
                  body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      margin: 0;
                      padding: 20px;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      min-height: 100vh;
                  }
                  .container {
                      max-width: 1000px;
                      margin: 0 auto;
                      background: rgba(255, 255, 255, 0.1);
                      padding: 30px;
                      border-radius: 15px;
                      backdrop-filter: blur(10px);
                      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                  }
                  h1 {
                      text-align: center;
                      margin-bottom: 30px;
                      font-size: 2.5em;
                      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
                  }
                  .status {
                      background: rgba(76, 175, 80, 0.2);
                      border: 2px solid #4CAF50;
                      border-radius: 10px;
                      padding: 20px;
                      margin: 20px 0;
                      text-align: center;
                  }
                  .info {
                      background: rgba(33, 150, 243, 0.2);
                      border: 2px solid #2196F3;
                      border-radius: 10px;
                      padding: 20px;
                      margin: 20px 0;
                  }
                  .timestamp {
                      text-align: center;
                      font-size: 0.9em;
                      opacity: 0.8;
                      margin-top: 30px;
                  }
                  .features {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                      gap: 20px;
                      margin: 30px 0;
                  }
                  .feature {
                      background: rgba(255, 255, 255, 0.1);
                      padding: 20px;
                      border-radius: 10px;
                      text-align: center;
                  }
                  .feature h3 {
                      margin-top: 0;
                      color: #FFD700;
                  }
                  .env-files {
                      background: rgba(255, 193, 7, 0.2);
                      border: 2px solid #FFC107;
                      border-radius: 10px;
                      padding: 20px;
                      margin: 20px 0;
                  }
                  .user-list {
                      background: rgba(156, 39, 176, 0.2);
                      border: 2px solid #9C27B0;
                      border-radius: 10px;
                      padding: 20px;
                      margin: 20px 0;
                  }
                  .user-item {
                      background: rgba(255, 255, 255, 0.1);
                      padding: 10px;
                      margin: 5px 0;
                      border-radius: 5px;
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                  }
                  .env-badge {
                      background: #FFC107;
                      color: #000;
                      padding: 2px 8px;
                      border-radius: 10px;
                      font-size: 0.8em;
                      font-weight: bold;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🔐 IAM Key Rotation Demo</h1>
                  
                  <div class="status">
                      <h2>✅ Deployment Successful</h2>
                      <p>Application deployed after IAM key rotation with OIDC authentication</p>
                  </div>
                  
                  <div class="info">
                      <h3>🔄 Rotation Information</h3>
                      <p><strong>Trigger:</strong> IAM Key Rotation (7-day policy)</p>
                      <p><strong>Environment:</strong> Multi-file Demo</p>
                      <p><strong>Pipeline:</strong> GitHub Actions with OIDC</p>
                      <p><strong>Status:</strong> Healthy</p>
                      <p><strong>Authentication:</strong> OIDC (No stored credentials)</p>
                  </div>
                  
                  <div class="env-files">
                      <h3>📁 Environment Files</h3>
                      <p><strong>env1.env:</strong> 2 IAM users (demo-user-1, demo-user-2)</p>
                      <p><strong>env2.env:</strong> 3 IAM users (demo-user-2, demo-user-3, demo-user-4)</p>
                      <p><strong>Common User:</strong> demo-user-2 (appears in both files)</p>
                  </div>
                  
                  <div class="user-list">
                      <h3>👥 IAM Users</h3>
                      <div class="user-item">
                          <span>demo-user-1</span>
                          <span class="env-badge">env1.env</span>
                      </div>
                      <div class="user-item">
                          <span>demo-user-2</span>
                          <span class="env-badge">env1.env, env2.env</span>
                      </div>
                      <div class="user-item">
                          <span>demo-user-3</span>
                          <span class="env-badge">env2.env</span>
                      </div>
                      <div class="user-item">
                          <span>demo-user-4</span>
                          <span class="env-badge">env2.env</span>
                      </div>
                  </div>
                  
                  <div class="features">
                      <div class="feature">
                          <h3>🔒 Security</h3>
                          <p>Automated key rotation with KMS encryption</p>
                      </div>
                      <div class="feature">
                          <h3>🚀 CI/CD</h3>
                          <p>GitHub Actions pipeline with OIDC</p>
                      </div>
                      <div class="feature">
                          <h3>📊 Monitoring</h3>
                          <p>Comprehensive health monitoring and rollback</p>
                      </div>
                      <div class="feature">
                          <h3>🛡️ Compliance</h3>
                          <p>Audit trail and security best practices</p>
                      </div>
                      <div class="feature">
                          <h3>⏰ Automation</h3>
                          <p>7-day automatic rotation policy</p>
                      </div>
                      <div class="feature">
                          <h3>🔄 Multi-file</h3>
                          <p>Handles multiple .env files independently</p>
                      </div>
                  </div>
                  
                  <div class="timestamp">
                      <p>Deployed on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</p>
                      <p>Pipeline triggered by IAM key rotation with OIDC authentication</p>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Deploy to S3
        run: |
          # Get app bucket name
          APP_BUCKET=$(aws cloudformation describe-stacks --stack-name iam-rotation-demo --query 'Stacks[0].Outputs[?OutputKey==`DemoAppBucket`].OutputValue' --output text)
          
          # Upload the website
          aws s3 cp index.html s3://$APP_BUCKET/
          
          # Make it publicly readable
          aws s3 cp s3://$APP_BUCKET/index.html s3://$APP_BUCKET/index.html --acl public-read
          
          echo "✅ Application deployed to s3://$APP_BUCKET/index.html"
          
          # Get the website URL
          WEBSITE_URL="https://$APP_BUCKET.s3-website-us-east-1.amazonaws.com"
          echo "🌐 Website URL: $WEBSITE_URL"

  post-deployment-health-check:
    runs-on: ubuntu-latest
    needs: [fetch-credentials, deploy-application]
    if: needs.deploy-application.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.fetch-credentials.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ needs.fetch-credentials.outputs.aws-secret-access-key }}
          aws-region: ${{ needs.fetch-credentials.outputs.aws-region }}

      - name: Post-deployment health check
        run: |
          python3 scripts/health-check.py
        env:
          AWS_ACCESS_KEY_ID: ${{ needs.fetch-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ needs.fetch-credentials.outputs.aws-secret-access-key }}
          AWS_REGION: ${{ needs.fetch-credentials.outputs.aws-region }}

  rollback:
    runs-on: ubuntu-latest
    needs: [fetch-credentials, health-check, backup-current]
    if: |
      needs.health-check.outputs.rollback-needed == 'true' ||
      (needs.post-deployment-health-check.outputs.rollback-needed == 'true' && needs.post-deployment-health-check.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.fetch-credentials.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ needs.fetch-credentials.outputs.aws-secret-access-key }}
          aws-region: ${{ needs.fetch-credentials.outputs.aws-region }}

      - name: Rollback application
        run: |
          # Get app bucket name
          APP_BUCKET=$(aws cloudformation describe-stacks --stack-name iam-rotation-demo --query 'Stacks[0].Outputs[?OutputKey==`DemoAppBucket`].OutputValue' --output text)
          
          # Find the most recent backup
          LATEST_BACKUP=$(aws s3 ls s3://$APP_BUCKET/backup/ | grep "index.html" | sort | tail -1 | awk '{print $4}')
          
          if [ -n "$LATEST_BACKUP" ]; then
            # Restore from backup
            aws s3 cp s3://$APP_BUCKET/backup/$LATEST_BACKUP s3://$APP_BUCKET/index.html --acl public-read
            echo "✅ Application rolled back from backup: $LATEST_BACKUP"
          else
            echo "⚠️ No backup found for rollback"
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [fetch-credentials, health-check, deploy-application, rollback]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.fetch-credentials.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ needs.fetch-credentials.outputs.aws-secret-access-key }}
          aws-region: ${{ needs.fetch-credentials.outputs.aws-region }}

      - name: Send notification
        run: |
          # Get notification topic ARN
          NOTIFICATION_TOPIC=$(aws cloudformation describe-stacks --stack-name iam-rotation-demo --query 'Stacks[0].Outputs[?OutputKey==`NotificationTopicArn`].OutputValue' --output text)
          
          # Determine status
          if [ "${{ needs.rollback.result }}" == "success" ]; then
            SUBJECT="IAM Rotation Pipeline - Rollback Required"
            MESSAGE="Pipeline completed with rollback due to health check failure."
          elif [ "${{ needs.deploy-application.result }}" == "success" ]; then
            SUBJECT="IAM Rotation Pipeline - Success"
            MESSAGE="Pipeline completed successfully. Application deployed and health checks passed."
          else
            SUBJECT="IAM Rotation Pipeline - Failed"
            MESSAGE="Pipeline failed during execution."
          fi
          
          # Send SNS notification
          aws sns publish \
            --topic-arn $NOTIFICATION_TOPIC \
            --subject "$SUBJECT" \
            --message "$MESSAGE"
          
          echo "✅ Notification sent to SNS topic"
