name: IAM Key Rotation Pipeline (Simple)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  setup-oidc:
    runs-on: ubuntu-latest
    outputs:
      aws-account-id: ${{ steps.get-account-id.outputs.account-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160885290762:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Get AWS Account ID
        id: get-account-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "AWS Account ID: $ACCOUNT_ID"

  test-aws-access:
    runs-on: ubuntu-latest
    needs: setup-oidc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160885290762:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Test AWS Access
        run: |
          echo "Testing AWS access..."
          aws sts get-caller-identity
          echo "✅ AWS access successful!"

      - name: List S3 Buckets
        run: |
          echo "Listing S3 buckets..."
          aws s3 ls
          echo "✅ S3 access successful!"

      - name: Check CloudFormation Stack
        run: |
          echo "Checking CloudFormation stack..."
          aws cloudformation describe-stacks --stack-name iam-rotation-demo --query 'Stacks[0].StackStatus' --output text
          echo "✅ CloudFormation access successful!"
